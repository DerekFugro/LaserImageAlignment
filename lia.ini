; LaserImageAlignment - where this installation keeps its folders.
; Plain text on purpose: open it, change a path, save. The app reads it
; at startup. A missing or blank value falls back to the built-in default,
; and --calibrations on the command line still overrides everything here.
;
; Order, most explicit first: --calibrations  >  the LIA_CALIBRATIONS /
; LIA_COLLECTIONS environment variables  >  this file  >  the built-in default.

[paths]

; REQUIRED in practice: holds LaserImageAlignmentLeverArms.md, without which
; every run is refused. On a machine that is not the original, set this to
; wherever you unzipped AllCalibrations.
calibrations = F:\Sidewalk\002_App\SidewalkProfilier\100_AllCalibrations

; Only where the viewer Open dialog starts. Blank is fine.
collections = F:\Sidewalk\099_CollectedData
